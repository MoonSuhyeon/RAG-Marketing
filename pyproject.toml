[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-retrieval"
version = "0.1.0"
description = "Hybrid retrieval core (dense + BM25 + RRF) with an abstain path"
requires-python = ">=3.11"
dependencies = ["faiss-cpu", "rank-bm25", "numpy", "openai"]

[tool.setuptools]
packages = ["retrieval"]
